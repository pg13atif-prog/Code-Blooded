<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineScope — Movie & TV Discovery</title>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React CSS/HTML Loader -->
      <style>
        body {
          background-color: #07070a;
          margin: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          overflow: hidden;
        }
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
        }
        .initial-logo {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
          animation: initial-pulse 2s infinite ease-in-out;
        }
        @keyframes initial-pulse {
          0%, 100% { transform: scale(0.95); opacity: 0.8; }
          50% { transform: scale(1.05); opacity: 1; }
        }
      </style>
      <div class="initial-loader">
        <img src="/favicon.png" alt="CineScope Logo" class="initial-logo" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
