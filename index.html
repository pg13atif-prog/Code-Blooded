<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="8jfxjojKw33U57c-yk0XJZoz4AENzx1-KR5NcVSMz1o" />
    <title>CineScope — Movie & TV Discovery</title>
    <style>
      html, body {
        background-color: #080c14;
        color: #ffffff;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: #080c14;
      }
      .preloader-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #131c2e 0%, #080c14 100%);
        z-index: 999999;
      }
      .preloader-logo-wrap {
        position: relative;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-spinner {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(229, 9, 20, 0.15);
        border-top-color: #e50914;
        animation: preloader-spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
      }
      .preloader-img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        animation: preloader-pulse 1.8s ease-in-out infinite;
      }
      .preloader-title {
        margin-top: 24px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #ffffff 0%, #a0aab8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: preloader-fade 1.5s ease-in-out infinite alternate;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px rgba(229, 9, 20, 0.8)); }
      }
      @keyframes preloader-fade {
        from { opacity: 0.6; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preloader-overlay">
        <div class="preloader-logo-wrap">
          <div class="preloader-spinner"></div>
          <img src="/favicon.png" alt="CineScope" class="preloader-img" />
        </div>
        <div class="preloader-title">CineScope</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
